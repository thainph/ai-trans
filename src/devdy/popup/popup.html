<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Devdy</title>
    <!-- Shared Context Kit theme (served from public/, not bundled) -->
    <link rel="stylesheet" href="/shared/theme.css" />
  </head>
  <body>
    <header class="app-header">
      <span class="app-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
      </span>
      <div>
        <div class="app-title">Devdy</div>
        <div class="app-subtitle">Send Slack threads and web pages to Devdy</div>
      </div>
    </header>

    <div class="section">
      <span class="field-label">Connection</span>
      <div class="card status-card">
        <div class="row-between">
          <span class="status-main"><span id="dot" class="dot" aria-hidden="true"></span><span id="summary">Checking…</span></span>
          <button id="refresh" type="button" class="link-btn">Refresh</button>
        </div>
        <div id="detail" class="muted-text"></div>
      </div>
    </div>

    <div class="section" id="instance-section" hidden>
      <label for="instance" class="field-label">Devdy app</label>
      <select id="instance" class="select-field"></select>
      <p class="muted-text" id="instance-hint" style="margin-top: 6px"></p>
    </div>

    <div class="section">
      <label for="token" class="field-label">Inbox API token</label>
      <div class="input-row">
        <input id="token" class="input-field" type="password" placeholder="Devdy → Settings → Inbox API" autocomplete="off" spellcheck="false" />
        <button id="token-save" type="button" class="btn btn-secondary btn-sm">Save</button>
      </div>
    </div>

    <div class="section" id="queue-section" hidden>
      <span class="field-label">Queue</span>
      <div class="row-between">
        <span id="queue" class="muted-text"></span>
        <button id="retry" type="button" class="link-btn">Retry now</button>
      </div>
    </div>

    <p id="status" class="status-line" role="status" aria-live="polite"></p>
    <p id="error" class="alert" role="alert" hidden></p>

    <hr class="divider" />
    <div class="how">
      <span class="field-label">How to send</span>
      <ul>
        <li><strong>Slack thread:</strong> right-click a message → <em>Send to Devdy</em>, or the Slack tab.</li>
        <li><strong>Selected text:</strong> select it on any page → <em>➤</em> in the floating toolbar.</li>
        <li><strong>Whole page:</strong> Web → MD tab → <em>Send to Devdy</em>.</li>
      </ul>
    </div>

    <style>
      .status-card { background: var(--bg); }
      .status-main { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
      .status-card .muted-text { margin-top: 4px; }
      .how ul { margin: 6px 0 0; padding-left: 18px; font-size: 12px; color: var(--text-muted); line-height: 1.6; }
      .how strong { color: var(--text); font-weight: 600; }
    </style>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
