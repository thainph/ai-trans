<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Slack Thread Exporter</title>
    <!-- Shared Context Kit theme (served from public/, not bundled) -->
    <link rel="stylesheet" href="/shared/theme.css" />
  </head>
  <body>
    <header class="app-header">
      <span class="app-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
          <path d="M8 9h8" /><path d="M8 13h5" />
        </svg>
      </span>
      <div>
        <div class="app-title">Slack Thread → Markdown</div>
        <div class="app-subtitle">Export a thread using your Slack session</div>
      </div>
    </header>

    <div class="section">
      <label for="link" class="field-label">Thread link</label>
      <input
        id="link"
        class="input-field"
        type="url"
        placeholder="https://your-team.slack.com/archives/C…/p…"
        autocomplete="off"
        spellcheck="false"
      />
    </div>

    <div class="section">
      <span class="field-label">Options</span>
      <div class="chip-group">
        <label class="chip">
          <input id="opt-reactions" type="checkbox" />
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12" /></svg>
          <span>Reactions</span>
        </label>
        <label class="chip">
          <input id="opt-files" type="checkbox" />
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12" /></svg>
          <span>Files</span>
        </label>
        <label class="chip" title="Export downloads attachments and saves a .zip (Markdown + attachments/)">
          <input id="opt-zip" type="checkbox" />
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12" /></svg>
          <span>Zip files</span>
        </label>
      </div>
    </div>

    <div class="btn-row">
      <button id="export" type="button" class="btn btn-primary" title="Saves .md, or .zip (Markdown + attachments/) when Zip files is on and the thread has attachments">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        <span>Export</span>
      </button>
      <button id="copy" type="button" class="btn btn-secondary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
        <span>Copy</span>
      </button>
    </div>

    <button id="devdy-send" type="button" class="btn btn-accent" style="margin-top: 8px" title="Send the thread (and attachments when Files is on) to the Devdy app">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" />
      </svg>
      <span>Send to Devdy</span>
    </button>

    <p id="status" class="status-line" role="status" aria-live="polite"></p>
    <p id="error" class="alert" role="alert" hidden></p>
    <button id="open-devdy" type="button" class="link-btn" hidden>Open Devdy settings →</button>


    <p class="hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10" /><line x1="12" y1="16" x2="12" y2="12" /><line x1="12" y1="8" x2="12.01" y2="8" />
      </svg>
      <span>Requires a logged-in <strong>app.slack.com</strong> tab</span>
    </p>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
