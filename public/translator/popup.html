<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AI Translator</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="app-header">
      <span class="app-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m5 8 6 6" /><path d="m4 14 6-6 2-3" /><path d="M2 5h12" /><path d="M7 2h1" />
          <path d="m22 22-5-10-5 10" /><path d="M14 18h6" />
        </svg>
      </span>
      <div>
        <div class="app-title">AI Translator</div>
        <div class="app-subtitle">Translate any text with AI</div>
      </div>
    </header>

    <div class="section">
      <label class="field-label">Provider</label>
      <div class="provider-tabs">
        <button class="provider-tab active" data-provider="openai">OpenAI</button>
        <button class="provider-tab" data-provider="gemini">Gemini</button>
        <button class="provider-tab" data-provider="ollama">Ollama</button>
      </div>
    </div>

    <div id="openaiSettings" class="section">
      <label for="apiKey">API Key</label>
      <div class="key-row">
        <input
          type="password"
          id="apiKey"
          placeholder="sk-..."
          autocomplete="off"
        />
        <button id="toggleKey" class="btn-icon" type="button" title="Show/Hide key" aria-label="Show or hide API key">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </div>
      <label for="openaiModel">Model</label>
      <select id="openaiModel" class="select-field">
        <option value="gpt-4o-mini">gpt-4o-mini</option>
        <option value="gpt-4o">gpt-4o</option>
        <option value="gpt-4-turbo">gpt-4-turbo</option>
        <option value="gpt-4.1-nano">gpt-4.1-nano</option>
        <option value="gpt-4.1-mini">gpt-4.1-mini</option>
        <option value="gpt-4.1">gpt-4.1</option>
        <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
      </select>
    </div>

    <div id="geminiSettings" class="section hidden">
      <label for="geminiApiKey">API Key</label>
      <div class="key-row">
        <input
          type="password"
          id="geminiApiKey"
          placeholder="AIza..."
          autocomplete="off"
        />
        <button id="toggleGeminiKey" class="btn-icon" type="button" title="Show/Hide key" aria-label="Show or hide Gemini API key">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </div>
      <label for="geminiModel">Model</label>
      <select id="geminiModel" class="select-field">
        <option value="gemini-3.6-flash">gemini-3.6-flash</option>
        <option value="gemini-3.5-flash">gemini-3.5-flash</option>
        <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
        <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite</option>
        <option value="gemini-2.5-flash">gemini-2.5-flash</option>
        <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite</option>
        <option value="gemini-2.5-pro">gemini-2.5-pro</option>
      </select>
    </div>

    <div id="ollamaSettings" class="section hidden">
      <label for="ollamaUrl">Ollama URL</label>
      <input
        type="text"
        id="ollamaUrl"
        class="input-field"
        placeholder="http://localhost:11434"
      />
      <label for="ollamaModel" style="margin-top: 12px">Model</label>
      <div class="model-row">
        <select id="ollamaModel" class="select-field">
          <option value="">-- Load models --</option>
        </select>
        <button id="refreshOllama" class="btn-icon" type="button" title="Refresh models" aria-label="Refresh Ollama models">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" /><polyline points="21 3 21 9 15 9" />
          </svg>
        </button>
      </div>
    </div>

    <div class="section">
      <label class="field-label">Translation Style</label>
      <div class="radio-group">
        <label class="radio-label">
          <input type="radio" name="style" value="casual" checked />
          <span>Casual</span>
        </label>
        <label class="radio-label">
          <input type="radio" name="style" value="polite" />
          <span>Polite</span>
        </label>
        <label class="radio-label">
          <input type="radio" name="style" value="business" />
          <span>Business</span>
        </label>
      </div>
    </div>

    <div class="section">
      <label for="targetLang" class="field-label">Target Language</label>
      <select id="targetLang" class="select-field">
        <option value="vietnamese">Vietnamese (Tiếng Việt)</option>
        <option value="english">English</option>
        <option value="japanese">Japanese (日本語)</option>
        <option value="chinese">Chinese (中文)</option>
        <option value="korean">Korean (한국어)</option>
        <option value="french">French (Français)</option>
        <option value="german">German (Deutsch)</option>
        <option value="spanish">Spanish (Español)</option>
        <option value="portuguese">Portuguese (Português)</option>
        <option value="russian">Russian (Русский)</option>
        <option value="thai">Thai (ไทย)</option>
        <option value="indonesian">Indonesian (Bahasa)</option>
        <option value="italian">Italian (Italiano)</option>
        <option value="dutch">Dutch (Nederlands)</option>
        <option value="arabic">Arabic (العربية)</option>
        <option value="hindi">Hindi (हिन्दी)</option>
      </select>
    </div>

    <div class="section">
      <button id="saveSettings" class="btn-primary btn-save">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
          <polyline points="17 21 17 13 7 13 7 21" /><polyline points="7 3 7 8 15 8" />
        </svg>
        <span>Save Settings</span>
      </button>
    </div>

    <hr class="divider" />

    <div class="section">
      <button id="translatePage" class="btn-translate-page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m5 8 6 6" /><path d="m4 14 6-6 2-3" /><path d="M2 5h12" /><path d="M7 2h1" />
          <path d="m22 22-5-10-5 10" /><path d="M14 18h6" />
        </svg>
        <span id="translatePageLabel">Translate This Page</span>
      </button>
    </div>

    <div id="status" class="status hidden"></div>

    <p class="hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z" />
      </svg>
      Select text on any page to translate
    </p>

    <script src="popup.js"></script>
  </body>
</html>
